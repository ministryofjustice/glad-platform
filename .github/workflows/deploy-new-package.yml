name: Publish Maven Package

on:
  push:
    tags:
      - 'glad-bom-*'
      - 'glad-parent-*'

  workflow_dispatch:
    inputs:
      module:
        description: 'Module to publish'
        required: true
        type: choice
        options:
          - glad-bom
          - glad-parent

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: maven-release

    steps:
      - name: Checkout Release Tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: corretto
          java-version: '25'
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Determine module
        id: module
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "module=${{ inputs.module }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          TAG="${GITHUB_REF_NAME}"

          case "$TAG" in
            glad-bom-*)
              echo "module=glad-bom" >> "$GITHUB_OUTPUT"
              ;;
            glad-parent-*)
              echo "module=glad-parent" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unknown release tag: $TAG"
              exit 1
              ;;
          esac

      - name: Show Maven coordinates
        run: |
          echo "Publishing module: ${{ steps.module.outputs.module }}"

          mvn --batch-mode \
            -f ${{ steps.module.outputs.module }}/pom.xml \
            help:evaluate \
            -Dexpression=project.groupId \
            -DforceStdout

          mvn --batch-mode \
            -f ${{ steps.module.outputs.module }}/pom.xml \
            help:evaluate \
            -Dexpression=project.artifactId \
            -DforceStdout

          mvn --batch-mode \
            -f ${{ steps.module.outputs.module }}/pom.xml \
            help:evaluate \
            -Dexpression=project.version \
            -DforceStdout

      - name: Build module
        run: |
          mvn --batch-mode \
            -f ${{ steps.module.outputs.module }}/pom.xml \
            clean verify

      - name: Debug Maven configuration
        if: failure()
        run: |
          echo "Actor: $GITHUB_ACTOR"
          echo "Ref: $GITHUB_REF_NAME"

          mvn --version

          mvn --batch-mode \
            -f ${{ steps.module.outputs.module }}/pom.xml \
            help:effective-pom > effective-pom.xml

          grep -A5 -B2 "distributionManagement" effective-pom.xml || true
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Snyk Scan
        uses: './.github/snyk-scan'
        with:
          snyk-token: ${{ secrets.SNYK_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Maven Package
        run: |
          mvn --batch-mode \
            -f ${{ steps.module.outputs.module }}/pom.xml \
            deploy
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
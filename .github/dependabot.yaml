version: 2

updates:
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "fix(bot)"
    cooldown:
      default-days: 3
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(bot)"
    cooldown:
      default-days: 3
    groups:
      minor:
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "*"
name: Snyk Scan

description: Run Snyk dependency scan

inputs:
  snyk-token:
    description: Snyk API token
    required: true

runs:
  using: composite

  steps:
    - name: Set up Java
      uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
      with:
        distribution: corretto
        java-version: '25'
        server-id: github
        server-username: GITHUB_ACTOR
        server-password: GITHUB_TOKEN

    - name: Setup Snyk CLI
      uses: snyk/actions/setup@9adf32b1121593767fc3c057af55b55db032dc04 # v1.0.0

    - name: Scan glad-bom
      id: 'glad-bom'
      continue-on-error: true
      shell: bash
      env:
        SNYK_TOKEN: ${{ inputs.snyk-token }}
      run: |
        snyk test \
        --package-manager=maven \
        --file=glad-bom/pom.xml \
        --severity-threshold=high \
        --sarif-file-output=snyk-glad-bom.sarif \
        --policy-path=./.snyk

    - name: Upload glad-bom SARIF
      if: always() && hashFiles('snyk-glad-bom.sarif') != ''
      uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
      with:
        sarif_file: snyk-glad-bom.sarif